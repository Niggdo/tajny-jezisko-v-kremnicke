<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
        <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

        <style>
            #hlavna-stranka {display: none;}

            .karta-osoby {
                background-color: #f0f0f0;
                padding: 10px;
                margin: 5px 0;
                border-radius: 5px;
                cursor: pointer;
            }

            .karta-osoby.vybrany {
                background-color: #d4edda;
                color: #155724;
                border: 2px solid #28a745;
            }

            #losovacie-okno {
                display: none;
                position: fixed;
                top: 20%; left: 25%;
                width: 50%; height: 50%;
                background-color: rgba(0, 0, 0, 0.85);
                justify-content: center;
                align-items: center;
            }

            .losovanie-obsah {
                color: #FFB8BF;
                padding: 30px;
                border-radius: 10px;
                text-align: center;
            }

            #vylosovane-meno {
                font-size: 100px;
                font-weight: bold;
                color: #FF7384;
                margin-top: 15px;
            }

            #zatvorit-btn {
                display: none;
                position: absolute;
                top: 5%;
                right: 5%;
                background: none;
                border: none;
                font-size: 30px;
                font-weight: bold;
                cursor: pointer;
                color: rgba(255, 255, 255, 0.5);
                transition: transform 0.2s ease, color 0.2s ease;
            }

            #zatvorit-btn:hover {
                color: rgba(255, 0, 0, 0.85);
                transform: scale(1.3);
            }

            @keyframes slotSkok {
                0% { transform: translateY(-30px); opacity: 0; }
                50% { transform: translateY(0); opacity: 1; }
                100% { transform: translateY(30px); opacity: 0; }
            }

            .animacia-slotu {
                animation: slotSkok 0.08s ease-in-out;
            }

             @media (max-width: 2000px) {
                #losovacie-okno {
                    width: 90%; left: 5%; top: 10%;
                }
                #vylosovane-meno {
                    font-size: 100px;
                }
            }
        </style>
    </head>
    <body>
        <div id="overenie">
            <h3>Overovacia otázka, či sem patríš :D</h3>
            <h1>Koľko má noha stoličiek?</h1>
            <select id="vyber-odpovede" autocomplete="off">
                <option value="">Vyber správnu odpoveď</option>
                <option value="zle"; onclick="alert('Skús znova!')">Je invalid</option>
                <option value="zle"; onclick="alert('Skús znova!')">Štyri</option>
                <option value="spravne">Nula</option>
                <option value="zle"; onclick="alert('Skús znova!')">Osem</option>
                <option value="spravne">Noha nemá stoličky</option>
                <option value="zle"; onclick="alert('Skús znova!')">4</option>
                <option value="zle2"; onclick="alert('Smola XD')">Nebaví ma to</option>
                <option value="spravne">Žiadnu</option>
            </select>
            <p id="chyba" style="color: red;"></p>
        </div>

        <div id="hlavna-stranka">
            <h3>Vyber si, kto si:</h3>

            <div id="hKorec">
                <h2>House of Korec</h2>
                <div class="karta-osoby">Dedo</div>
                <div class="karta-osoby">Stará mama</div>
            </div>

            <br>

            <div id="hKorecjr">
                <h2>House of Korec jr.</h2>
                <div class="karta-osoby">Roman</div>
                <div class="karta-osoby">Natálka</div>
                <div class="karta-osoby">Maťka</div>
                <div class="karta-osoby">Jakub</div>
            </div>

            <br>

            <div id="hStracina">
                <h2>House of Stračina</h2>
                <div class="karta-osoby">Rasťo</div>
                <div class="karta-osoby">Bejka</div>
                <div class="karta-osoby">Samko</div>
                <div class="karta-osoby">Marek</div>
                <div class="karta-osoby">Nika</div>
                <div class="karta-osoby">Kika</div>
                <div class="karta-osoby">Mirko</div>
            </div>

            <br>

            <div id="hDizin">
                <h2>House of Dižin</h2>
                <div class="karta-osoby">Sisa</div>
                <div class="karta-osoby">Braňo</div>
                <div class="karta-osoby">Adam</div>
                <div class="karta-osoby">Dominika</div>
            </div>

            <br>

            <div style="margin-top: 20px;">
                <label>
                    <input type="checkbox" id="potvrdenie" autocomplete="off"> Potvrdzujem, že som to ja. Druhýkrát nemôžem byť vybraný a strácam právo druhýkrát losovať!
                </label>
                <br><br>
                <button id="losovat" autocomplete="off" disabled>LOSOVAŤ</button>
            </div>
        </div>

        <div id="losovacie-okno">
            <button id="zatvorit-btn">x</button>
            <div class="losovanie-obsah" style="position: relative;">
                <h2>Tvoja osoba je:</h2>
                <div id="vylosovane-meno"></div>
            </div>
        </div>

        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyD-n2pZQqjBrif4OyKNxiv7DM3L7eGOfjw",
                authDomain: "tajny-jezisko.firebaseapp.com",
                databaseURL: "https://tajny-jezisko-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "tajny-jezisko",
                storageBucket: "tajny-jezisko.firebasestorage.app",
                messagingSenderId: "620944184857",
                appId: "1:620944184857:web:0158cea94a8748340abc88",
                measurementId: "G-5G883F4352"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            document.getElementById("vyber-odpovede").addEventListener("change", function(){
                let zvolenaHodnota = this.value;
                if (zvolenaHodnota === "spravne") {
                    document.getElementById("overenie").style.display = "none";
                    document.getElementById("hlavna-stranka").style.display = "block";
                }
                else if (zvolenaHodnota === "zle") {
                    document.getElementById("chyba").innerText = "Vyber znova inú odpoveď...";
                }
                else if (zvolenaHodnota === "zle2") {
                    document.getElementById("chyba").innerText = "Prečo? :(";
                }
            });

            let uzLosovane = false;
            let zvolenaOsoba = null; 

            db.ref("secretSanta").on("value", function(snapshot) {
                let data = snapshot.val() || {};
                let uzLosovaliOsoby = data.losovali || {};

                let VsetkyKarty = document.querySelectorAll(".karta-osoby");
                VsetkyKarty.forEach(function(karta) {
                    let menoOsoby = karta.innerText;
                    if (uzLosovaliOsoby[menoOsoby]) {
                        karta.style.opacity = "0.3";
                        karta.style.pointerEvents = "none";
                    }
                });
            });

            let karty = document.querySelectorAll(".karta-osoby");
            karty.forEach(function(karta) {
                karta.addEventListener("click", function(){
                    if (uzLosovane) return;
                    karty.forEach(function(k){
                        k.classList.remove("vybrany");
                    });
                    this.classList.add("vybrany");

                    zvolenaOsoba = this.innerText;
                    console.log("Vybral som sa: " + zvolenaOsoba);

                    skontrolujTlacitko();
                });
            });

            let checkbox = document.getElementById("potvrdenie");
            let losovatBtn = document.getElementById("losovat");

            function skontrolujTlacitko() {
                if (zvolenaOsoba !== null && checkbox.checked) {
                    losovatBtn.disabled = false;
                } else {
                    losovatBtn.disabled = true;
                }
            }
            checkbox.addEventListener("change", skontrolujTlacitko);

            losovatBtn.addEventListener("click", function() {
                uzLosovane = true;
                losovatBtn.disabled = true;
                checkbox.disabled = true;

                let vybranaKarta = document.querySelector(".karta-osoby.vybrany");
                let domOsoby = vybranaKarta.closest("div[id]");
                let mojaOsoba = vybranaKarta.innerText;

                db.ref("secretSanta").once("value", function(snapshot) {
                    let data = snapshot.val() || {};
                    let vylosovaniLudia = data.vylosovani || {};

                    let VsetkyKarty = document.querySelectorAll(".karta-osoby");
                    let mozniKandidati = [];

                    VsetkyKarty.forEach(function(karta){
                        let menoKarty = karta.innerText;
                        let jeZTohoIstéhoDomu = karta.closest("#" + domOsoby.id);
                        let uzBolVylosovany = vylosovaniLudia[menoKarty];

                        if (!jeZTohoIstéhoDomu && !uzBolVylosovany) {
                            mozniKandidati.push(menoKarty);
                        }
                    });

                    document.getElementById("losovacie-okno").style.display = "flex";
                    let slotDisplay = document.getElementById("vylosovane-meno");
                    let counter = 0;

                    let interval = setInterval(function() {
                        let nahodneMeno = mozniKandidati[Math.floor(Math.random() * mozniKandidati.length)];
                        
                        slotDisplay.classList.remove("animacia-slotu");
                        void slotDisplay.offsetWidth; 
                        slotDisplay.innerText = nahodneMeno;
                        slotDisplay.classList.add("animacia-slotu");

                        counter++;
                        if (counter > 20) {
                            clearInterval(interval);
                            let finalnyVitaz = mozniKandidati[Math.floor(Math.random() * mozniKandidati.length)];
                            slotDisplay.innerText = finalnyVitaz;

                            db.ref("secretSanta/losovali/" + mojaOsoba).set(true);
                            db.ref("secretSanta/vylosovani/" + finalnyVitaz).set(true);

                            setTimeout(function(){
                                document.getElementById("zatvorit-btn").style.display = "block";
                            }, 1000);
                        }
                    }, 100);
                });
            });

            document.getElementById("zatvorit-btn").addEventListener("click", function (){
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #262626; font-family: sans-serif; text-align: center;">
                        <h1 style="color: #FF7384; font-size: 40px;">Hotovo!<br>Vidíme sa na Vianoce.🎄</h1>
                    </div>
                `;
                confetti({
                    particleCount: 100,
                    spread: 200,
                    origin: { y: 0.6 }
                });
            });
        </script>
    </body>
</html>
