        <style>

            @keyframes wiggle {
                0% { transform: scale(1) rotate(0deg);}
                25% { transform: scale(1) rotate(-5deg);}

            .karta-osoby {
                background-color: rgba(100, 100, 100, 0.068);

        <script>
            const firebaseConfig = {
                apiKey: "AIzaSyD-n2pZQqjBrif4OyKNxiv7DM3L7eGOfjw",
                authDomain: "tajny-jezisko.firebaseapp.com",
                databaseURL: "https://tajny-jezisko-default-rtdb.europe-west1.firebasedatabase.app",
                projectId: "tajny-jezisko",
                storageBucket: "tajny-jezisko.firebasestorage.app",
                messagingSenderId: "620944184857",
                appId: "1:620944184857:web:0158cea94a8748340abc88",
                measurementId: "G-5G883F4352"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

            document.getElementById("vyber-odpovede").addEventListener("change", function(){
                let zvolenaHodnota = this.value;
                if (zvolenaHodnota === "spravne") {
                    document.getElementById("overenie").style.display = "none";
                    document.getElementById("hlavna-stranka").style.display = "block";
                }
                else if (zvolenaHodnota === "zle") {
                    document.getElementById("chyba").innerText = "Vyber znova inú odpoveď...";
                }
                else if (zvolenaHodnota === "zle2") {
                    document.getElementById("chyba").innerText = "Prečo? :(";
                }
            });

            let uzLosovane = false;
            let zvolenaOsoba = null; 

            db.ref("secretSanta").on("value", function(snapshot) {
                let data = snapshot.val() || {};
                let uzLosovaliOsoby = data.losovali || {};

                let VsetkyKarty = document.querySelectorAll(".karta-osoby");
                VsetkyKarty.forEach(function(karta) {
                    let img = karta.querySelector("img");
                    let menoOsoby = img ? img.alt : karta.innerText;

                    if (uzLosovaliOsoby[menoOsoby]) {
                        karta.style.opacity = "0.3";
                        karta.style.pointerEvents = "none";
                        if (img) {
                            img.style.filter = "grayscale(100%)";
                        }
                    }
                });
            });

            let karty = document.querySelectorAll(".karta-osoby");
            karty.forEach(function(karta) {
                karta.addEventListener("click", function(){
                    if (uzLosovane) return;
                    karty.forEach(function(k){
                        k.classList.remove("vybrany");
                    });
                    this.classList.add("vybrany");

                    let img = this.querySelector("img");
                    zvolenaOsoba = img ? img.alt : this.innerText;
                    console.log("Vybral som sa: " + zvolenaOsoba);

                    skontrolujTlacitko();
                });
            });

            let checkbox = document.getElementById("potvrdenie");
            let losovatBtn = document.getElementById("losovat");

            function skontrolujTlacitko() {
                if (zvolenaOsoba !== null && checkbox.checked) {
                    losovatBtn.disabled = false;
                } else {
                    losovatBtn.disabled = true;
                }
            }
            checkbox.addEventListener("change", skontrolujTlacitko);

            let vsetciLudia = Array.from(document.querySelectorAll(".karta-osoby")).map(function(karta) {
                let img = karta.querySelector("img");
                return {
                    meno: img ? img.alt : karta.innerText,
                    dom: karta.closest("div[id]").id
                };
            });
            let vsetkyDomy = vsetciLudia.map(function(o) { return o.dom; })
                .filter(function(dom, i, pole) { return pole.indexOf(dom) === i; });

            // Kandidat je povoleny len ak po jeho vylosovani plati pre kazdy dom:
            // pocet este nelosujucich ludi z domu <= pocet este nevylosovanych ludi mimo domu.
            // Vdaka tomu losovanie vzdy dojde do konca.
            function najdiKandidatov(data, mojaOsoba, mojDom) {
                let losovali = data.losovali || {};
                let vylosovani = data.vylosovani || {};

                let zostavajuciLosujuci = vsetciLudia.filter(function(o) {
                    return !losovali[o.meno] && o.meno !== mojaOsoba;
                });

                return vsetciLudia.filter(function(kandidat) {
                    if (vylosovani[kandidat.meno] || kandidat.dom === mojDom) return false;

                    let zostavajuciVybery = vsetciLudia.filter(function(o) {
                        return !vylosovani[o.meno] && o.meno !== kandidat.meno;
                    });

                    if (zostavajuciLosujuci.length > zostavajuciVybery.length) return false;

                    return vsetkyDomy.every(function(dom) {
                        let losujuciVDome = zostavajuciLosujuci.filter(function(o) { return o.dom === dom; }).length;
                        let vyberyMimoDomu = zostavajuciVybery.filter(function(o) { return o.dom !== dom; }).length;
                        return losujuciVDome <= vyberyMimoDomu;
                    });
                }).map(function(o) { return o.meno; });
            }

            losovatBtn.addEventListener("click", function() {
                uzLosovane = true;
                losovatBtn.disabled = true;
                checkbox.disabled = true;

                let vybranaKarta = document.querySelector(".karta-osoby.vybrany");
                let domOsoby = vybranaKarta.closest("div[id]");
                let imgVybranej = vybranaKarta.querySelector("img");
                let mojaOsoba = imgVybranej ? imgVybranej.alt : vybranaKarta.innerText;

                db.ref("secretSanta").once("value", function(snapshot) {
                    let data = snapshot.val() || {};
                    let mozniKandidati = najdiKandidatov(data, mojaOsoba, domOsoby.id);

                    if (mozniKandidati.length === 0) {
                        alert("Nikto ti nezostal na vylosovanie. Obnov stránku a skús to znova.");
                        uzLosovane = false;
                        checkbox.disabled = false;
                        skontrolujTlacitko();
                        return;
                    }

                    let animacnaMena = vsetciLudia.filter(function(o) {
                        return o.dom !== domOsoby.id;
                    }).map(function(o) { return o.meno; });

                    document.getElementById("losovacie-okno").style.display = "flex";
                    let slotDisplay = document.getElementById("vylosovane-meno");
                    let counter = 0;

                    let interval = setInterval(function() {
                        let nahodneMeno = animacnaMena[Math.floor(Math.random() * animacnaMena.length)];
                        
                        slotDisplay.classList.remove("animacia-slotu");
                        void slotDisplay.offsetWidth; 
                        slotDisplay.innerText = nahodneMeno;
                        slotDisplay.classList.add("animacia-slotu");

                        counter++;
                        if (counter > 20) {
                            clearInterval(interval);
                            let finalnyVitaz = null;

                            db.ref("secretSanta").transaction(function(aktualne) {
                                let data = aktualne || {};
                                finalnyVitaz = null;

                                if ((data.losovali || {})[mojaOsoba]) return;

                                let kandidati = najdiKandidatov(data, mojaOsoba, domOsoby.id);
                                if (kandidati.length === 0) return;

                                finalnyVitaz = kandidati[Math.floor(Math.random() * kandidati.length)];

                                data.losovali = data.losovali || {};
                                data.vylosovani = data.vylosovani || {};
                                data.losovali[mojaOsoba] = true;
                                data.vylosovani[finalnyVitaz] = true;
                                return data;
                            }, function(chyba, potvrdene) {
                                if (chyba || !potvrdene || !finalnyVitaz) {
                                    alert("Losovanie sa nepodarilo. Obnov stránku a skús to znova.");
                                    document.getElementById("losovacie-okno").style.display = "none";
                                    uzLosovane = false;
                                    checkbox.disabled = false;
                                    skontrolujTlacitko();
                                    return;
                                }

                                slotDisplay.innerText = finalnyVitaz;

                                setTimeout(function(){
                                    document.getElementById("zatvorit-btn").style.display = "block";
                                }, 1000);
                            });
                        }
                    }, 100);
                });
            });

             document.getElementById("zatvorit-btn").addEventListener("click", function (){
             let text1 = "Hotovo!";

             let html1 = Array.from(text1).map(c => `<span class="pismenko">${c}</span>`).join('');
             let html2 = Array.from(text2).map(c => c === ' ' ? '&nbsp;' : `<span class="pismenko">${c}</span>`).join('');
             let htmlStromcek = `<a href="${tajnyLink}" target="_blank" class="pismenko" style="text-decoration: none; cursor: pointer;">🎄</a>`;

             document.body.innerHTML = `
                 <div id="final-page" style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #262626; text-align: center; flex-direction: column;">
                     <h1 style="color: #FF7384; font-size: 35px">

                     <span style="font-size: 50px">${html2}${htmlStromcek}</span>
                     </h1>
                 </div>
                 `;

             let vsetkyPismenka = document.querySelectorAll(".pismenko");

             vsetkyPismenka.forEach(function(pismenko, index) {
                 pismenko.addEventListener("mouseenter", function() {
                     this.classList.add("hovered");
 
                    if (index > 0) {
                     vsetkyPismenka[index - 1].classList.add("neighbor");
                    }
                     if (index < vsetkyPismenka.length - 1) {
                     vsetkyPismenka[index + 1].classList.add("neighbor");
                     }
                 });

                pismenko.addEventListener("mouseleave", function() {
                     vsetkyPismenka.forEach(p => p.classList.remove("hovered", "neighbor"));
                 });
              });

                 confetti({
                    particleCount: 100,
                    spread: 200,
                    origin: { y: 0.6 }
